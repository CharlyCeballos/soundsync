# Builds a draft release from a vMAJOR.MINOR.PATCH tag (todo 3.1, 3.2): Windows
# zip, Debian package and SHA256SUMS. The author reviews the draft and
# publishes it by hand; the in-app update notice only sees published releases.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    env:
      # Through env, never interpolated into run: (script injection).
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3, got: $TAG"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - run: go vet ./...
      - run: go test ./...

      - name: build
        env:
          CGO_ENABLED: '0'
          GOARCH: amd64
        run: |
          GOOS=windows go build -trimpath -ldflags "-X main.version=$TAG" -o build/windows/soundsync.exe ./cmd/soundsync
          GOOS=linux go build -trimpath -ldflags "-X main.version=$TAG" -o build/linux/soundsync ./cmd/soundsync

      - name: windows zip
        run: |
          mkdir -p dist
          zip -j "dist/soundsync_${VERSION}_windows_amd64.zip" build/windows/soundsync.exe LICENSE .env.example

      - name: debian package
        run: |
          pkg=build/deb
          install -Dm755 build/linux/soundsync "$pkg/usr/bin/soundsync"
          install -Dm644 LICENSE "$pkg/usr/share/doc/soundsync/copyright"
          install -Dm644 .env.example "$pkg/usr/share/doc/soundsync/env.example"
          mkdir -p "$pkg/DEBIAN"
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: soundsync
          Version: $VERSION
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Carlos Ceballos <74975887+CharlyCeballos@users.noreply.github.com>
          Recommends: xdg-utils
          Homepage: https://github.com/CharlyCeballos/soundsync
          Description: copy Spotify playlists to YouTube
           Command-line tool that copies your Spotify playlists to YouTube
           playlists (visible in YouTube Music). Each user brings their own
           Spotify app and Google OAuth client.
          EOF
          dpkg-deb --root-owner-group --build "$pkg" "dist/soundsync_${VERSION}_amd64.deb"

      - name: smoke test the package
        run: |
          sudo dpkg -i "dist/soundsync_${VERSION}_amd64.deb"
          soundsync version | tee /dev/stderr | grep -F "soundsync $TAG "

      - name: checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --draft --verify-tag --generate-notes --title "Soundsync $TAG" --repo "$GITHUB_REPOSITORY" dist/*
